[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintrack-pc"
version = "0.1.0"
description = "PC side of FinTrack: sync with the phone, MCP tools for Claude, local console, training dataset"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "pydantic>=2.5",
]

[project.optional-dependencies]
statements = ["openpyxl>=3.1", "xlrd>=2.0", "pdfplumber>=0.10"]
test = ["pytest>=8", "openpyxl>=3.1", "xlrd>=2.0"]

[project.scripts]
fintrack = "fintrack_pc.cli:main"

[tool.setuptools]
packages = ["fintrack_pc"]

[tool.setuptools.package-data]
fintrack_pc = ["static/*.html"]
